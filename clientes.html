<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wilfredo Web</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<header>
  <h1 class="titulo">Wiltorre <span>Chef</span></h1>
</header>
<div id="menu"></div>
<script src="JavaScript/menu.js"></script>

<div id="carrusel"></div>
<script src="JavaScript/carrusel.js"></script>

<body>
  <main class="contenedor sombra">
    <h1>Catálogo</h1>
    <div class="catalogo">
      <section class="cliente">
        <h3>Desayuno</h3>
        <div class="galeria">
          <div class="producto">
            <img src="imagenes/tostones.jpg" alt="Tostones">
            <div class="producto-info">
              <h4>Tostones</h4>
              <p class="precio">Q15</p>
            </div>
          </div>
          <div class="producto">
            <img src="imagenes/huevosrancheros.jpg" alt="Huevos Rancheros">
            <div class="producto-info">
              <h4>Huevos Rancheros</h4>
              <p class="precio">Q25</p>
            </div>
          </div>
          <div class="producto">
            <img src="imagenes/cereal.avif" alt="Cereal">
            <div class="producto-info">
              <h4>Cereal</h4>
              <p class="precio">Q20</p>
            </div>
          </div>
        </div>
      </section>

      <section class="cliente">
        <h3>Almuerzo</h3>
        <div class="galeria">
          <div class="producto">
            <img src="imagenes/pollo.jpg" alt="Alitas de pollo">
            <div class="producto-info">
              <h4>Alitas de pollo</h4>
              <p class="precio">Q30</p>
            </div>
          </div>
          <div class="producto">
            <img src="imagenes/sopa.avif" alt="Sopa de fideos">
            <div class="producto-info">
              <h4>Sopa de fideos</h4>
              <p class="precio">Q15</p>
            </div>
          </div>
          <div class="producto">
            <img src="imagenes/ensalada.avif" alt="Ensalada">
            <div class="producto-info">
              <h4>Ensalada</h4>
              <p class="precio">Q20</p>
            </div>
          </div>
        </div>
      </section>

      <section class="cliente">
        <h3>Cena</h3>
        <div class="galeria">
          <div class="producto">
            <img src="imagenes/tostadas.jpg" alt="Tostadas">
            <div class="producto-info">
              <h4>Tostadas</h4>
              <p class="precio">Q25</p>
            </div>
          </div>
          <div class="producto">
            <img src="imagenes/burrito.jpg" alt="Burritos">
            <div class="producto-info">
              <h4>Burritos</h4>
              <p class="precio">Q35</p>
            </div>
          </div>
          <div class="producto">
            <img src="imagenes/sandwich.jpg" alt="Sandwich">
            <div class="producto-info">
              <h4>Sandwich</h4>
              <p class="precio">Q10</p>
            </div>
          </div>
        </div>
      </section>

      <section class="cliente">
        <h3>Refacción</h3>
        <div class="galeria">
          <div class="producto">
            <img src="imagenes/refa1.avif" alt="Arroz en leche">
            <div class="producto-info">
              <h4>Arroz en leche</h4>
              <p class="precio">Q5</p>
            </div>
          </div>
          <div class="producto">
            <img src="imagenes/refa2.jpg" alt="Chocolate">
            <div class="producto-info">
              <h4>Chocolate</h4>
              <p class="precio">Q21</p>
            </div>
          </div>
          <div class="producto">
            <img src="imagenes/refa3.jpg" alt="Pupusas">
            <div class="producto-info">
              <h4>Pupusas</h4>
              <p class="precio">Q10</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
